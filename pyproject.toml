[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tinymeta"
version = "0.1.0"
description = "Local, traceable metadata tagging for scientific datasets"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "TinyMeta contributors"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "pydantic>=2.7,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0,<6"]
dev = ["pytest>=8.2,<9", "ruff>=0.6,<1"]

[project.scripts]
tinymeta = "tinymeta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tinymeta"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: downloads and exercises an external model"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
